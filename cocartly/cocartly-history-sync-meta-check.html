<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cocartly 購入履歴・同期管理照合</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:620px;margin:auto;padding:18px;background:#f6f8fb;color:#172436;line-height:1.7}button{font-size:1rem;padding:12px;border:0;border-radius:9px;background:#1457b8;color:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;border:1px solid #d8e0eb;border-radius:10px;padding:15px}small{color:#555}</style></head><body><h2>購入履歴・同期管理の最終照合</h2><p>読み取り専用。保存・削除・クラウド通信は行いません。Aユーザーでログイン中の同じChromeで開いてください。</p><button id="go">照合する</button><pre id="out">未確認</pre><small>ユーザーID、商品名、履歴ID、購入金額は表示しません。</small><script>document.getElementById('go').onclick=()=>{const out=document.getElementById('out');try{const prefix='cocartly:v1:',auth=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^sb-[a-z0-9-]+-auth-token$/i.test(k)){try{const v=JSON.parse(localStorage.getItem(k));if(/^[0-9a-f-]{36}$/i.test(v?.user?.id||''))auth.push('user:'+v.user.id)}catch{}}}const owners=[...new Set(auth)];if(owners.length!==1){out.textContent='ログイン中のユーザーを特定できません。';return}const base=prefix+owners[0]+':',get=(key)=>{const raw=localStorage.getItem(base+key);return raw?JSON.parse(raw):null};const h=get('shoppingSupportPriceHistory'),p=get('shoppingSupportProducts'),m=get('cocartly-cloud-sync-meta');if(!Array.isArray(h)||!Array.isArray(p)){out.textContent='購入履歴または商品登録データを取得できません。';return}const pids=new Set(p.map(x=>String(x?.id??''))),active=h.filter(x=>x&&x.active!==false),orphans=active.filter(x=>!pids.has(String(x.productId??''))),tracked=m?.records?.priceHistory;if(!tracked||typeof tracked!=='object'){out.textContent='同期管理情報のpriceHistoryが見つかりません。\n履歴総数：'+h.length+'件\n対応商品なし：'+orphans.length+'件';return}const trackedIds=new Set(Object.keys(tracked));out.textContent=['Aユーザー履歴総数：'+h.length+'件','有効履歴：'+active.length+'件','商品登録に対応しない有効履歴：'+orphans.length+'件','上記のうち同期管理IDに存在：'+orphans.filter(x=>trackedIds.has(String(x.id??''))).length+'件','上記のうち同期管理IDに存在しない：'+orphans.filter(x=>!trackedIds.has(String(x.id??''))).length+'件','同期管理に記録された購入履歴ID総数：'+trackedIds.size+'件'].join('\n')}catch(e){out.textContent='確認中にエラー：'+String(e?.message||e)}};</script></body></html>
