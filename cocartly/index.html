<!DOCTYPE html>
<html lang="ja">

<head>
    <!-- ========================================
         Shopping Support
         Version 0.1.0
         ホーム画面
         ======================================== -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Support</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- JavaScript -->
    <script defer src="js/data/maker.js"></script>
    <script defer src="js/data/category.js"></script>
    <script defer src="js/data/product.js"></script>
    <script defer src="js/data/store.js"></script>
    <script defer src="js/data/price.js"></script>
    <script defer src="js/history.js"></script>
    <script defer src="js/router.js"></script>
    <script defer src="js/app.js"></script>
</head>

<body>

    <!-- ========================================
         PC・タブレット表示
         ======================================== -->
    <div id="desktop-message">

        <h1>⚠️</h1>

        <p>
            Shopping Support はスマートフォン専用です。
        </p>

        <p>
            PC・タブレットではご利用いただけません。
        </p>

    </div>

    <!-- 横向き案内 -->
    <div id="orientationMessage" hidden>

        <div class="orientationContent">

            <div class="orientationIcon">
                ↻
            </div>

            <h2>
                スマートフォンを縦向きにしてください
            </h2>

            <p>
                このアプリは縦向きでの使用に最適化されています。
            </p>

        </div>

    </div>

    <main id="app">

        <!-- ========================================
         スマホ画面
         ======================================== -->
        <main id="app">

            <!-- ホーム画面 -->
            <section id="homeScreen">

                <header>

                    <h1>Shopping Support</h1>

                    <p>Version 0.1.0</p>

                </header>

                <nav>

                    <button id="btnCode">
                        📷 コード読取
                    </button>

                    <button id="btnProduct">
                        ➕ 商品登録
                    </button>

                    <button id="btnShopping">
                        🛒 購入予定
                    </button>

                    <button id="btnHistory">
                        📊 履歴・価格比較
                    </button>

                    <button id="btnCheck">
                        🎒 お出かけチェック
                    </button>

                    <button id="btnSettings">
                        ⚙️ 設定
                    </button>

                </nav>

            </section>

            <!-- コード読取画面 -->
            <section id="codeScreen" hidden>

                <header>

                    <button id="btnBackCode">

                        ← 戻る

                    </button>

                    <h2>コード読取</h2>

                </header>

                <p>

                    バーコードを枠内へ合わせてください。

                </p>

                <div id="cameraArea">

                    <video id="cameraVideo" autoplay playsinline>

                    </video>

                    <!-- バーコード読取ガイド -->
                    <div id="scanFrame">

                        <span class="scanCorner scanCornerTopLeft"></span>
                        <span class="scanCorner scanCornerTopRight"></span>
                        <span class="scanCorner scanCornerBottomLeft"></span>
                        <span class="scanCorner scanCornerBottomRight"></span>

                        <div class="scanLine"></div>

                    </div>

                    <!-- 読取成功表示 -->
                    <div id="scanSuccess" hidden>

                        <span>✓</span>

                        <p>読み取りました</p>

                    </div>

                </div>

                <p id="scanStatus">

                    読み取り待機中...

                </p>

                <div class="scanButtons">

                    <button id="btnFlash" class="btn-sub">
                        🔦 ライト
                    </button>

                    <button id="btnJanInput" class="btn-sub">
                        ⌨ JAN入力
                    </button>

                    <button id="btnCancelScan" class="btn-sub">
                        🏠 ホームへ
                    </button>

                </div>

            </section>

            <!-- 商品登録画面 -->
            <section id="productScreen" hidden>

                <header>

                    <h2>📦 商品登録</h2>

                </header>

                <!-- 商品名 -->
                <label for="txtProductName">
                    商品名
                </label>

                <input type="text" id="txtProductName" placeholder="例：シャンプー">

                <!-- JANコード -->
                <label for="txtJanCode">
                    JANコード
                </label>

                <input type="text" id="txtJanCode" inputmode="numeric" maxlength="14" placeholder="バーコード読取時に自動入力"
                    readonly>

                <!-- 商品ジャンル -->
                <label for="cmbCategory">
                    商品ジャンル
                </label>

                <select id="cmbCategory">

                </select>

                <button type="button" id="btnManageCategories" class="master-manage-button">

                    ⚙ 商品ジャンル管理

                </button>

                <!-- 購入先 -->
                <label for="cmbStore">
                    購入先
                </label>

                <select id="cmbStore">
                    <option value="">選択してください</option>
                </select>

                <button type="button" id="btnManageStores" class="master-manage-button">

                    🏬 購入先管理

                </button>

                <!-- 内容量 -->
                <label for="txtVolume">
                    内容量
                </label>

                <input type="number" id="txtVolume" placeholder="例：400">

                <!-- 単位 -->
                <label for="cmbUnit">
                    単位
                </label>

                <select id="cmbUnit">
                    <option value="mL">mL</option>
                    <option value="L">L</option>
                    <option value="g">g</option>
                    <option value="kg">kg</option>
                    <option value="個">個</option>
                </select>

                <!-- 価格（税込） -->
                <label for="txtPrice">
                    価格（税込）
                </label>
                <input type="number" id="txtPrice" placeholder="例：298">

                <div class="shareBox">

                    <label for="chkShareProduct" class="shareOption">

                        <input type="checkbox" id="chkShareProduct">

                        <span class="shareText">

                            <span class="shareTitle">
                                Cocartlyの商品マスターへ共有
                            </span>

                            <span class="shareDescription">
                                商品名・JANコード・商品ジャンルなどを共有します。
                                価格や購入先は共有されません。
                            </span>

                            <span class="shareThanks">
                                商品情報の充実にご協力いただき、ありがとうございます。
                            </span>

                        </span>

                    </label>

                </div>

                <div class="productButtons">

                    <button id="btnSaveProduct" class="btn-main">
                        保存
                    </button>

                    <button id="btnDeletedProducts" class="btn-main">
                        🗑 削除済みアイテム（0）
                    </button>

                    <button id="btnHomeFromProduct" class="btn-main">
                        🏠 ホームへ
                    </button>

                </div>

                <p id="productMessage"></p>

                <!-- 登録済み商品 -->
                <h3>登録済み商品</h3>

                <div id="productList"></div>

            </section>

            <!-- ========================================
                 履歴・価格比較画面
                 ======================================== -->
            <section id="historyScreen" hidden>

                <header>

                    <button id="btnBackHistory">
                        🏠 ホームへ
                    </button>

                    <h2>
                        履歴・価格比較
                    </h2>

                </header>

                <!-- 履歴表示切替 -->
                <div class="history-view-switch">

                    <button type="button" id="btnHistoryByDate" class="history-view-button active">

                        🕒 購入順

                    </button>

                    <button type="button" id="btnHistoryByProduct" class="history-view-button">

                        📦 商品ごと

                    </button>

                </div>

                <button
                    type="button"
                    id="btnDeletedPriceHistory"
                    class="history-deleted-button">

                    🗑 削除済み履歴

                </button>

                <div id="historyList">

                </div>

            </section>

            <!-- ========================================
     　　　　　　  今回価格記録画面
                 ======================================== -->
            <section id="priceRecordScreen" hidden>

                <header>

                    <button type="button" id="btnBackPriceRecord" onclick="backFromPriceRecord()">

                        ← 戻る

                    </button>

                    <h2>
                        今回の価格を記録
                    </h2>

                </header>

                <!-- 商品名 -->
                <div class="product-card">

                    <strong id="priceRecordProductName">
                        商品名
                    </strong>

                    <p id="priceRecordPreviousPrice">
                        前回価格：記録なし
                    </p>

                </div>

                <!-- 購入先 -->
                <label for="cmbPriceRecordStore">
                    購入先
                </label>

                <select id="cmbPriceRecordStore">

                    <option value="">
                        購入先を選択してください
                    </option>

                </select>

                <!-- 今回価格 -->
                <label for="txtPriceRecordPrice">
                    今回価格（税込）
                </label>

                <input type="number" id="txtPriceRecordPrice" inputmode="numeric" placeholder="例：198">

                <!-- 数量 -->
                <label for="txtPriceRecordQuantity">
                    購入数量
                </label>

                <input type="number" id="txtPriceRecordQuantity" min="1" value="1">

                <button type="button" class="btn-main" onclick="saveCurrentPriceRecord()">

                    購入価格を記録

                </button>

                <p id="priceRecordMessage"></p>

            </section>

            <!-- 削除済みアイテム画面 -->
            <section id="deletedProductScreen" hidden>

                <header>

                    <button id="btnBackProduct">
                        ← 戻る
                    </button>

                    <h2>削除済みアイテム</h2>

                </header>

                <div id="deletedProductList">

                </div>

            </section>

            <!-- 設定画面 -->
            <section id="settingsScreen" hidden>

                <header>

                    <button id="btnBackSettings">

                        ← 戻る

                    </button>

                    <h2>設定</h2>

                </header>

                <button id="btnCategoryMaster">

                    商品ジャンル管理

                </button>

                <button id="btnStoreMaster">

                    🏬 購入先管理

                </button>

            </section>

            <!-- 商品ジャンル管理画面 -->
            <section
                id="categoryScreen"
                class="master-screen"
                hidden>
                
                <header>

                    <button id="btnBackCategory">

                        ← 戻る

                    </button>

                    <h2>商品ジャンル管理</h2>

                </header>

                <div class="master-input-area">

                    <label for="txtCategoryName">
                        商品ジャンル名
                    </label>

                    <input
                        type="text"
                        id="txtCategoryName"
                        placeholder="例：食品、飲料、日用品">

                    <button
                        type="button"
                        id="btnSaveCategory"
                        class="master-save-button">

                        ＋ 保存

                    </button>

                </div>

                <div id="categoryList">

                </div>

            </section>

            <!-- ==========================================
             店舗管理画面
             ========================================== -->

            <section id="storeScreen" hidden>

                <header>

                    <h2>🏬 購入先管理</h2>

                </header>

                <label for="cmbStoreType">
                    購入先の種類
                </label>

                <select id="cmbStoreType">

                    <option value="">選択してください</option>
                    <option value="supermarket">スーパー</option>
                    <option value="convenience">コンビニ・売店</option>
                    <option value="drugstore">ドラッグストア</option>
                    <option value="discount">ディスカウントストア</option>
                    <option value="warehouse-club">会員制倉庫店</option>
                    <option value="fixed-price">100円・均一価格店</option>
                    <option value="home-center">ホームセンター</option>
                    <option value="department-mall">百貨店・ショッピングモール</option>
                    <option value="clothing">衣料品店</option>
                    <option value="electronics">家電量販店</option>
                    <option value="gas-station">ガソリンスタンド併設店</option>
                    <option value="specialty">専門店</option>
                    <option value="online">通販・オンライン</option>
                    <option value="subscription">定期購入</option>
                    <option value="vending">自動販売機</option>
                    <option value="other">その他</option>

                </select>

                <label for="txtStoreName">
                    購入先名
                </label>

                <input type="text" id="txtStoreName" placeholder="例：イオン、Amazon">

                <button id="btnSaveStore" class="btn-main">
                    💾 保存
                </button>

                <p id="storeMessage"></p>

                <h3>登録済み購入先</h3>

                <div id="storeList"></div>

                <button id="btnBackStore" class="btn-main">
                    ⚙ 設定へ
                </button>

            </section>

        </main>

        <script src="https://unpkg.com/@zxing/library@latest"></script>
        <script defer src="js/barcode/code.js"></script>
        <script defer src="js/barcode/barcode.js"></script>
        <script defer src="js/barcode/qrcode.js"></script>
        <script defer src="js/api/productApi.js"></script>


</body>

</html>
