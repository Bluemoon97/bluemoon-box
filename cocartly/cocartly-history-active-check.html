<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cocartly 購入履歴・有効件数確認</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:560px;margin:auto;padding:20px;line-height:1.7;background:#f7f8fa;color:#1c2935}section{background:white;padding:16px;border-radius:12px;margin:12px 0}button{background:#165fc1;color:white;border:0;border-radius:10px;padding:12px 18px;font-size:1rem}h1{font-size:1.35rem}#result{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><h1>Cocartly 購入履歴・有効件数確認</h1><p>読み取り専用です。購入履歴・認証情報の保存、削除、変更、送信は行いません。ユーザーIDや購入内容は表示しません。</p><button id="check" type="button">照合する</button><section id="result" aria-live="polite">未確認</section><script>"use strict";(()=>{const PREFIX='cocartly:v1:',H='shoppingSupportPriceHistory';const out=document.getElementById('result');function activity(raw){if(raw===null)return 'データなし';try{const a=JSON.parse(raw);if(!Array.isArray(a))return '形式不明';let active=0,inactive=0,invalid=0;for(const h of a){if(!h||typeof h!=='object'){invalid++;continue}if(h.active===false)inactive++;else active++}return '有効 '+active+'件 / 削除扱い '+inactive+'件 / 不正形式 '+invalid+'件'}catch{return 'JSON解析不可'}}function count(raw){if(raw===null)return 'なし';try{const a=JSON.parse(raw);return Array.isArray(a)?a.length+'件':'形式不明'}catch{return '形式不明'}}document.getElementById('check').addEventListener('click',()=>{try{const owners=new Set();let sessionOwners=new Set(),authCandidates=0;for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);const m=/^cocartly:v1:(user:[0-9a-f-]{36}):/.exec(k);if(m)owners.add(m[1]);if(/^sb-[a-z0-9-]+-auth-token$/i.test(k)){authCandidates++;try{const obj=JSON.parse(localStorage.getItem(k));const u=obj&&obj.user&&obj.user.id;if(typeof u==='string'&&/^[0-9a-f-]{36}$/i.test(u))sessionOwners.add('user:'+u)}catch{}}}const arr=[...owners].sort();const lines=['旧共通履歴: '+count(localStorage.getItem(H)),'ゲスト専用履歴: '+count(localStorage.getItem(PREFIX+'guest:'+H)),'ユーザー専用領域: '+arr.length+'個'];arr.forEach((owner,i)=>{lines.push('ユーザー専用'+(i+1)+': '+count(localStorage.getItem(PREFIX+owner+':'+H)))});if(authCandidates===0||sessionOwners.size===0){lines.push('現在の認証ユーザーとの一致: 判定できません（認証情報が検出されません）')}else if(sessionOwners.size!==1){lines.push('現在の認証ユーザーとの一致: 判定できません（認証候補が複数）')}else{const owner=[...sessionOwners][0];lines.push('現在の認証ユーザーの専用領域: '+(arr.includes(owner)?'検出':'未検出'));lines.push('現在の認証ユーザーの購入履歴: '+count(localStorage.getItem(PREFIX+owner+':'+H)));lines.push('現在の認証ユーザーの履歴状態: '+activity(localStorage.getItem(PREFIX+owner+':'+H)));lines.push('69件の専用領域との一致: '+(arr.filter(o=>count(localStorage.getItem(PREFIX+o+':'+H))==='69件').includes(owner)?'一致':'一致しない'))}out.textContent=lines.join('\n')}catch(e){out.textContent='照合に失敗しました。データの変更は行っていません。'}})})();</script></body></html>
