<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cocartly 購入履歴バックアップ</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:#f6f8fb;color:#152238;margin:0;padding:20px;line-height:1.7}main{max-width:620px;margin:auto}section{background:white;border:1px solid #d9e1ec;border-radius:12px;padding:18px;margin:14px 0}button{border:0;background:#1556b7;color:white;font-size:16px;font-weight:600;border-radius:9px;padding:13px 18px;width:100%}button:disabled{opacity:.45}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#536277}</style></head><body><main><h2>Cocartly 購入履歴バックアップ</h2><section><strong>読み取り専用</strong><p>ログイン中のユーザー専用領域から購入履歴を読み取り、端末にJSONファイルとして保存します。元データの変更・削除、Supabase通信は行いません。</p><small>必ずCocartlyと同じGitHub Pagesのドメイン・公開パスで開いてください。バックアップJSONをGitHubやチャットにアップロードしないでください。</small></section><section><button id="inspect">履歴件数を確認</button><pre id="status" aria-live="polite">未確認</pre><button id="download" disabled>バックアップJSONを保存</button></section><script>
(()=>{'use strict';const status=document.getElementById('status'),download=document.getElementById('download');let payload=null;
function authOwner(){const found=new Set();for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!/^sb-[a-z0-9-]+-auth-token$/i.test(k))continue;try{const v=JSON.parse(localStorage.getItem(k));if(/^[0-9a-f-]{36}$/i.test(v?.user?.id||''))found.add('user:'+v.user.id)}catch{}}return [...found]}
document.getElementById('inspect').addEventListener('click',()=>{payload=null;download.disabled=true;try{const owners=authOwner();if(owners.length!==1)throw Error('ログインユーザーを1人に特定できません。Cocartlyにログインして再度確認してください。');const raw=localStorage.getItem('cocartly:v1:'+owners[0]+':shoppingSupportPriceHistory');if(raw===null)throw Error('ユーザー専用の購入履歴が見つかりません。');const records=JSON.parse(raw);if(!Array.isArray(records))throw Error('購入履歴の形式が不正です。');const active=records.filter(x=>x&&x.active!==false).length;const inactive=records.filter(x=>x&&x.active===false).length;const date=new Date();payload={format:'cocartly-price-history-backup-v1',exportedAt:date.toISOString(),recordCount:records.length,activeCount:active,inactiveCount:inactive,records};status.textContent=`購入履歴：${records.length}件\n有効：${active}件\n削除済み：${inactive}件\n\n数字が正しければ「バックアップJSONを保存」を押してください。`;download.disabled=false;}catch(e){status.textContent='保存できません：'+String(e.message||e)}});
download.addEventListener('click',()=>{if(!payload)return;const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='cocartly-price-history-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();status.textContent+='\n\n保存を開始しました。Chromeのダウンロードまたは「ファイル」アプリで実際に保存されたことを確認してください。';setTimeout(()=>URL.revokeObjectURL(url),60000)});
})();
</script></main></body></html>
