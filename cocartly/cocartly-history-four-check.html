<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cocartly 履歴4件照合（読み取り専用）</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f7fa;color:#1b2937;max-width:600px;margin:auto;padding:14px;line-height:1.55}h1{font-size:1.25rem}section,article{background:#fff;border:1px solid #dbe1e8;border-radius:12px;padding:12px;margin:10px 0}article{display:flex;gap:12px;align-items:flex-start}input[type=checkbox]{width:24px;height:24px;flex:none}small{color:#526273}button{background:#165fc1;color:white;border:0;border-radius:10px;padding:12px 18px;font-size:1rem}#result{white-space:pre-wrap;overflow-wrap:anywhere}strong{overflow-wrap:anywhere}.muted{color:#53616f}</style></head><body><h1>購入履歴4件の照合</h1><p>読み取り専用。保存・削除・通信・同期は一切行いません。Aユーザーでログイン中に、同じブラウザで開いてください。</p><button id="run" type="button">履歴を確認</button><section id="summary" aria-live="polite">未確認</section><div id="records"></div><section id="result" aria-live="polite">ゲストの4件が見つかったら、該当するチェック欄を選んでください。</section><script>"use strict";(()=>{const P='cocartly:v1:',H='shoppingSupportPriceHistory',S=document.getElementById('summary'),R=document.getElementById('records'),O=document.getElementById('result');let records=[],guestIds=new Set(),legacyIds=new Set();function parse(k){try{const a=JSON.parse(localStorage.getItem(k));return Array.isArray(a)?a:[]}catch{return []}}function id(x){return String(x?.id??'')}function label(x){return String(x??'').slice(0,140)}function add(parent,tag,value,cls){const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;parent.append(e);return e}function report(){const chosen=[...R.querySelectorAll('input:checked')].map(e=>records[Number(e.dataset.i)]);O.textContent='選択：'+chosen.length+'件\nゲスト専用領域にも同じ履歴IDがある：'+chosen.filter(x=>guestIds.has(id(x))).length+'件\n旧共通履歴にも同じ履歴IDがある：'+chosen.filter(x=>legacyIds.has(id(x))).length+'件\n商品登録に対応する商品がない：'+chosen.filter(x=>!x._hasProduct).length+'件\n※このページでは何も変更されません。履歴IDや購入内容をチャットへ送る必要はありません。'}document.getElementById('run').onclick=()=>{R.replaceChildren();records=[];let owners=new Set(),auth=new Set();for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^sb-[a-z0-9-]+-auth-token$/i.test(k)){try{const v=JSON.parse(localStorage.getItem(k));if(/^[0-9a-f-]{36}$/i.test(v?.user?.id??''))auth.add('user:'+v.user.id)}catch{}}}if(auth.size!==1){S.textContent='ログイン中のユーザーを一意に判定できません。アプリにログインしてから再実行してください。';return}const owner=[...auth][0],hist=parse(P+owner+':'+H),products=parse(P+owner+':shoppingSupportProducts'),guest=parse(P+'guest:'+H),legacy=parse(H);guestIds=new Set(guest.map(id));legacyIds=new Set(legacy.map(id));const productIds=new Set(products.map(id));records=hist.filter(x=>x&&typeof x==='object'&&x.active!==false).map(x=>({...x,_hasProduct:productIds.has(String(x.productId??''))})).sort((a,b)=>Date.parse(b.purchasedAt||0)-Date.parse(a.purchasedAt||0));S.textContent='Aユーザー専用履歴：全'+hist.length+'件 / 有効'+records.length+'件\nゲスト専用履歴：'+guest.length+'件\n有効履歴のうち商品登録に対応なし：'+records.filter(x=>!x._hasProduct).length+'件\n※商品登録に対応なし＝ゲストの商品とは限りません。実際に知っている4件を選んでください。';records.forEach((x,i)=>{const art=document.createElement('article'),check=document.createElement('input'),box=document.createElement('div');check.type='checkbox';check.dataset.i=i;check.setAttribute('aria-label','履歴'+(i+1)+'を選択');check.onchange=report;art.append(check);add(box,'strong',(i+1)+'. '+label(x.productName||x.name||'商品名の記録なし'));add(box,'div','購入日：'+label(x.purchasedAt||'不明'));add(box,'div','価格：'+label(x.price??'不明')+' / 店舗ID：'+label(x.storeId||'なし'));add(box,'small','Aの商品登録：'+(x._hasProduct?'対応あり':'対応なし')+' / ゲスト履歴ID一致：'+(guestIds.has(id(x))?'あり':'なし')+' / 旧共通履歴ID一致：'+(legacyIds.has(id(x))?'あり':'なし'));art.append(box);R.append(art)});report()}})();</script></body></html>
